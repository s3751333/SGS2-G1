<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookNook | Login</title>
    <link rel="stylesheet" href="css/loginRegister.css">
</head>

<body>
    <nav class="navbar">
        <div class="content">
            <div class="logo">
                <a href="./">
                    SGS2-G1
                </a>
            </div>
            <ul class="menu-list">
                <div class="icon cancel-btn">
                    <i class="fas fa-times"></i>
                </div>
                <li><a href="index.html" class="nav-a-black">Home</a></li>
                <li><a href="blogs.html" class="nav-a-black">Blog</a></li>

            </ul>
            <div class="icon menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>
    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-card">
                <h1 class="auth-title">Login</h1>

                <form>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Enter your password">
                    </div>

                    <button class="auth-btn">Sign In</button>

                </form>

                <div class="auth-text">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </div>

            </div>

        </div>

    </div>

    <script src="js/navbar.js"></script>
    <script src="https://kit.fontawesome.com/6416005539.js" crossorigin="anonymous"></script>
