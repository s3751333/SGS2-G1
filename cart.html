<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - Bookstore</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Bookstore</a>
      <nav><a href="index.html">← Continue shopping</a></nav>
    </header>

    <main class="cart-page">
      <h1>Shopping Cart</h1>
      <div class="cart-layout">
        <section class="cart-items" aria-label="Cart items">
          <article class="cart-item">
            <img src="img/harry-potter.jpg" alt="Harry Potter book" />
            <div class="item-info">
              <h2>Harry Potter</h2>
              <p>150,000 VND</p>
              <a class="remove-link" href="cart.html">Remove</a>
            </div>
            <div class="quantity" aria-label="Quantity">
              <button type="button">−</button><span>1</span><button type="button">+</button>
            </div>
            <strong class="item-total">150,000 VND</strong>
          </article>

          <article class="cart-item">
            <img src="img/the-little-prince.jpg" alt="The Little Prince book" />
            <div class="item-info">
              <h2>The Little Prince</h2>
              <p>100,000 VND</p>
              <a class="remove-link" href="cart.html">Remove</a>
            </div>
            <div class="quantity" aria-label="Quantity">
              <button type="button">−</button><span>2</span><button type="button">+</button>
            </div>
            <strong class="item-total">200,000 VND</strong>
          </article>

          <article class="cart-item">
            <img src="img/uno.jpg" alt="Uno card game" />
            <div class="item-info">
              <h2>Uno</h2>
              <p>100,000 VND</p>
              <a class="remove-link" href="cart.html">Remove</a>
            </div>
            <div class="quantity" aria-label="Quantity">
              <button type="button">−</button><span>1</span><button type="button">+</button>
            </div>
            <strong class="item-total">100,000 VND</strong>
          </article>
        </section>
        <aside class="order-summary">
          <h2>Order Summary</h2>
          <div class="summary-row"><span>Subtotal</span><strong>450,000 VND</strong></div>
          <div class="summary-row"><span>Shipping</span><strong>Free</strong></div>
          <hr />
          <div class="summary-row total"><span>Total</span><strong>450,000 VND</strong></div>
          <a class="button-link checkout-button" href="checkout.html">Checkout</a>
        </aside>
      </div>
    </main>
  </body>
</html>
