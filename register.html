<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNook | Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/default.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/loginRegister.css">
    <link rel="stylesheet" href="css/site-theme.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">SGS2-G1</a>
            </div>
            <ul class="menu-list">
                <div class="icon cancel-btn">
                    <i class="fas fa-times"></i>
                </div>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="blogs.html" class="nav-link">Blog</a></li>
                <li><a href="products.html" class="nav-link">Shop</a></li>
                <li><a href="forum-main.html" class="nav-link">Forum</a></li>
            </ul>
            <div class="right-menu">
                <a href="profile.html" class="nav-link auth-btn"><i class="fas fa-user"></i> Profile</a>
                <a href="login.html" class="nav-link auth-btn">Sign In/Up</a>
                <a href="cart.html" class="cart-btn" aria-label="Shopping cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <div class="icon menu-btn">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <h1 class="auth-title">Create Account</h1>

                <form id="register-form" action="#" method="post" novalidate>

                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" minlength="2" maxlength="80" autocomplete="name" required>
                        <small id="fullname-message" aria-live="polite"></small>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" required>
                        <small id="username-message" aria-live="polite"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" maxlength="120" autocomplete="email" required>
                        <small id="email-message" aria-live="polite"></small>
                    </div>


                    <div class="form-group">
                        <label for="introduction">Introduction</label>
                        <textarea name="introduction" id="introduction" maxlength="300"
                            placeholder="I like the web."></textarea>
                        <small id="introduction-count">0 / 300 characters</small>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" autocomplete="new-password" required>
                        <small id="password-message" aria-live="polite"></small>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" minlength="8" autocomplete="new-password" required>
                        <small id="confirm-password-message" aria-live="polite"></small>
                    </div>
                    <p id="form-message" aria-live="polite"></p>
                    <button type="submit" class="auth-btn">Create Account</button>
                </form>
                <div class="auth-text">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/navbar.js"></script>
    <script src="js/register.js"></script>
    <script src="https://kit.fontawesome.com/6416005539.js" crossorigin="anonymous"></script>

</body>

</html>
