<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNook | Register</title>
    <link rel="stylesheet" href="css/loginRegister.css">
</head>

<body>
    <nav class="navbar">
        <div class="content">
            <div class="logo">
                <a href="./">
                    SGS2-G1
                </a>
            </div>
            <ul class="menu-list">
                <div class="icon cancel-btn">
                    <i class="fas fa-times"></i>
                </div>
                <li><a href="index.html" class="nav-a-black">Home</a></li>
                <li><a href="blogs.html" class="nav-a-black">Blog</a></li>
                <li><a href="login.html" class="nav-a-black">Sign In/Up</a></li>
                <li><a href="" class="nav-a-black">About Us</a></li>
                <li><a href="" class="nav-a-black">Contact</a></li>
                <li><a href="" class="nav-a-black"><i class="fas fa-cart-arrow-down"></i></a></li>
            </ul>
            <div class="icon menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <h1 class="auth-title">Create Account</h1>

                <form action="#" method="post">

                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>


                    <div class="form-group">
                        <label for="email">Introduction</label>
                        <textarea name="introduction" id="" placeholder="I like the web."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Confirm your password" required>
                    </div>

                    <button type="submit" class="auth-btn">
                        Create Account
                    </button>

                </form>

                <div class="auth-text">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </div>

            </div>

        </div>

    </div>

    <script src="js/navbar.js"></script>
    <script src="https://kit.fontawesome.com/6416005539.js" crossorigin="anonymous"></script>

</body>

</html>
