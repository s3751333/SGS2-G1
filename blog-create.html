<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS2-G1 | Content Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/blog-create.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">SGS2-G1</a>
            </div>
            <ul class="menu-list">
                <div class="icon cancel-btn">
                    <i class="fas fa-times"></i>
                </div>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="blogs.html" class="nav-link">Blog</a></li>
                <li><a href="products.html" class="nav-link">Shop</a></li>
                <li><a href="forum-main.html" class="nav-link">Forum</a></li>
            </ul>
            <div class="right-menu">
                <a href="login.html" class="nav-link auth-btn">Sign In/Up</a>
                <a href="cart.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <div class="icon menu-btn">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>
    <div class="admin-page">
        <div class="admin-container">
            <div class="admin-card">
                <h1 class="admin-title">Create New Post</h1>

                <form action="" method="post">
                    <div class="field-box">
                        <label for="post_title">Headline</label>
                        <input type="text" id="post_title" name="post_title" placeholder="What is the title?" required>
                    </div>

                    <div class="field-box">
                        <label for="post_author">Contributor</label>
                        <input type="text" id="post_author" name="post_author" placeholder="Who wrote this?" required>
                    </div>

                    <div class="field-box">
                        <label for="post_image">Cover Image Link</label>
                        <input type="text" id="post_image" name="post_image" placeholder="URL to the image">
                    </div>

                    <div class="field-box">
                        <label for="post_body">Main Content</label>
                        <textarea id="post_body" name="post_body" placeholder="Write your story here..."></textarea>
                    </div>

                    <button type="submit" class="save-btn">Publish Post</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/navbar.js"></script>
    <script src="https://kit.fontawesome.com/6416005539.js" crossorigin="anonymous"></script>
</body>

</html>
