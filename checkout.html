<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Bookstore</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Bookstore</a>
      <nav><a href="cart.html">← Back to cart</a></nav>
    </header>

    <main class="checkout-page">
      <h1>Checkout</h1>

      <div class="checkout-layout">
        <form id="checkout-form" class="checkout-form" action="index.html">
          <section class="form-section">
            <h2>Shipping Information</h2>
            <div class="form-grid">
              <label class="full-field">Full name
                <input type="text" name="fullName" autocomplete="name" required />
              </label>
              <label>Email
                <input type="email" name="email" autocomplete="email" required />
              </label>
              <label>Phone number
                <input type="tel" name="phone" autocomplete="tel" pattern="[0-9+ ]{9,15}" required />
              </label>
              <label class="full-field">Address
                <input type="text" name="address" autocomplete="street-address" required />
              </label>
              <label>City / Province
                <input type="text" name="city" autocomplete="address-level1" required />
              </label>
              <label>District
                <input type="text" name="district" autocomplete="address-level2" required />
              </label>
              <label class="full-field">Order note (optional)
                <textarea name="note" rows="3" placeholder="Delivery instructions..."></textarea>
              </label>
            </div>
          </section>

          <section class="form-section">
            <h2>Payment Method</h2>
            <label class="payment-option">
              <input type="radio" name="payment" value="cod" checked />
              <span><strong>Cash on delivery</strong><small>Pay when your order arrives</small></span>
            </label>
            <label class="payment-option">
              <input type="radio" name="payment" value="bank" />
              <span><strong>Bank transfer</strong><small>Transfer details will be shown after ordering</small></span>
            </label>
          </section>
        </form>

        <aside class="order-summary checkout-summary">
          <h2>Your Order</h2>
          <div>
            <div class="checkout-product">
              <img src="img/harry-potter.jpg" alt="Harry Potter book" />
              <span>Harry Potter<small>Quantity: 1</small></span>
              <strong>150,000 VND</strong>
            </div>
            <div class="checkout-product">
              <img src="img/the-little-prince.jpg" alt="The Little Prince book" />
              <span>The Little Prince<small>Quantity: 2</small></span>
              <strong>200,000 VND</strong>
            </div>
            <div class="checkout-product">
              <img src="img/uno.jpg" alt="Uno card game" />
              <span>Uno<small>Quantity: 1</small></span>
              <strong>100,000 VND</strong>
            </div>
          </div>
          <hr />
          <div class="summary-row"><span>Subtotal</span><strong>450,000 VND</strong></div>
          <div class="summary-row"><span>Shipping</span><strong>Free</strong></div>
          <div class="summary-row total"><span>Total</span><strong>450,000 VND</strong></div>
          <button class="checkout-button" type="submit" form="checkout-form">Place Order</button>
          <p class="secure-note">Your information is used only to process this order.</p>
        </aside>
      </div>

    </main>
  </body>
</html>
