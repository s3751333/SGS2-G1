<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Start a new BookNook community discussion about a book or board game.">
    <title>BookNook | Start a Discussion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/forum.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">SGS2-G1</a>
            </div>
            <ul class="menu-list">
                <li class="icon cancel-btn">
                    <i class="fas fa-times"></i>
                </li>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="blogs.html" class="nav-link">Blog</a></li>
                <li><a href="products.html" class="nav-link">Shop</a></li>
                <li><a href="forum-main.html" class="nav-link">Forum</a></li>
            </ul>
            <div class="right-menu">
                <a href="login.html" class="nav-link auth-btn">Sign In/Up</a>
                <a href="cart.html" class="cart-btn" aria-label="Shopping cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <div class="icon menu-btn">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="page-container form-container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="forum-main.html">Forum</a> / Start a discussion
        </nav>

        <section class="topic-form-card" aria-labelledby="form-title">
            <h1 id="form-title">Start a new discussion</h1>
            <p>Choose a subject and explain what you would like the community to discuss.</p>

            <form id="topic-form" action="forum-topic.html" method="get">
                <div class="form-field">
                    <label for="topic-category">Category</label>
                    <select id="topic-category" name="category" required>
                        <option value="">Choose a category</option>
                        <option value="english">English Books</option>
                        <option value="vietnamese">Vietnamese Books</option>
                        <option value="board-games">Board Games</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="topic-title">Discussion title</label>
                    <input id="topic-title" name="title" type="text"
                        placeholder="Example: Recommend a short mystery novel" required>
                </div>

                <div class="form-field">
                    <label for="topic-message">Message</label>
                    <textarea id="topic-message" name="message" rows="9"
                        placeholder="Add enough detail so other members can help..." required></textarea>
                </div>

                <div class="checkbox-field">
                    <input id="reply-notification" name="notification" type="checkbox">
                    <label for="reply-notification">Email me when someone replies</label>
                </div>

                <div class="form-actions">
                    <a class="secondary-button" href="forum-main.html">Cancel</a>
                    <button class="button" type="submit">Publish discussion</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="forum-footer">
        <p>&copy; 2026 SGS2-G1 BookNook</p>
    </footer>

    <script src="js/navbar.js"></script>
    <script src="https://kit.fontawesome.com/6416005539.js" crossorigin="anonymous"></script>
</body>

</html>
