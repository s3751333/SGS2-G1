<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/blogs.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">SGS2-G1</a>
            </div>
            <ul class="menu-list">
                <div class="icon cancel-btn">
                    <i class="fas fa-times"></i>
                </div>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="blogs.html" class="nav-link" aria-current="page">Blog</a></li>
                <li><a href="products.html" class="nav-link">Shop</a></li>
                <li><a href="forum-main.html" class="nav-link">Forum</a></li>
            </ul>
            <div class="right-menu">
                <a href="profile.html" class="nav-link auth-btn"><i class="fas fa-user"></i> Profile</a>
                <a href="login.html" class="nav-link auth-btn">Sign In/Up</a>
                <a href="cart.html" class="cart-btn" aria-label="Shopping cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <div class="icon menu-btn">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>


    <div class="blog-header">
        <h1>Latest Blog Posts</h1>
    </div>

    <div class="search-container">
        <input type="text" placeholder="Search by title..." class="search-input">
        <select class="filter-select">
            <option value="all">All Categories</option>
            <option value="programming">Programming</option>
            <option value="mobile">Mobile App</option>
            <option value="cloud">Cloud Computing</option>
            <option value="cybersecurity">Cybersecurity</option>
        </select>

        <button class="search-btn">Search</button>
    </div>

    <p id="blog-status" class="blog-status" aria-live="polite">Loading blog posts...</p>
    <main id="blog-list" class="blog-container"></main>

    <footer class="forum-footer">
        <p>&copy; 2026 SGS2-G1 BookNook | <a href="sitemap.html">Sitemap</a></p>
    </footer>

    <script src="js/navbar.js"></script>
    <script src="js/blogs.js"></script>
    <script src="https://kit.fontawesome.com/6416005539.js" crossorigin="anonymous"></script>

</body>

</html>
